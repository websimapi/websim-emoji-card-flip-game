<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Card Flip Game</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/card-flip.css">
  <script src="js/game.js" type="module"></script>
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <input type="text" class="search-input" placeholder="Search cards...">
      <button class="search-button">Search</button>
    </header>

    <main class="main-content">
      <button class="scroll-arrow scroll-up">▲</button>
      <div class="bubble-container" id="cardGrid"></div>
      <button class="scroll-arrow scroll-down">▼</button>
    </main>

    <div class="pagination">
      <span class="page-info">Page <span id="currentPage">1</span></span>
      <div class="page-controls">
        <button class="page-button" id="prevPage">←</button>
        <button class="page-button" id="nextPage">→</button>
      </div>
    </div>

    <div class="details-panel">
      <div class="details-image" id="lastFlippedEmoji">❓</div>
      <div class="details-content">
        <h3 class="details-title">Last Flipped Card</h3>
        <p class="details-description" id="flipDescription">Flip a card to discover a unique emoji!</p>
      </div>
    </div>
  </div>

</body>
</html>
